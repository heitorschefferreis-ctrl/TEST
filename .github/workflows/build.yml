name: Build Geode Mod
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          platform: win
        - name: Android32
          os: ubuntu-latest
          platform: android32
        - name: Android64
          os: ubuntu-latest
          platform: android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4

    # CORREÇÃO DEFINITIVA: O nome real do repositório deles tem o "-cli" no final!
    - name: Setup Geode CLI
      uses: geode-sdk/setup-geode-cli@main

    # Agora o ambiente vai ter o CLI e o CMake vai achar tudo!
    - name: Build Mod
      uses: geode-sdk/build-geode-mod@main  
      with:
        platform: ${{ matrix.config.platform }}