name: Build Geode Mod
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          target: Win       # Mantém o target do Windows corrigido!
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Build Mod
      # FIX: Voltamos para a @main que é a oficial documentada no repositório do Geode
      uses: geode-sdk/build-geode-mod@main  
      with:
        target: ${{ matrix.config.target }}