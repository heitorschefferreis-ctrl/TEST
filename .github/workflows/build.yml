name: Build Geode Mod
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          platform: win
        - name: Android32
          os: ubuntu-latest
          platform: android32
        - name: Android64
          os: ubuntu-latest
          platform: android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4

    # PULO DO GATO: Instala a CLI e o SDK do Geode antes de tentar compilar!
    - name: Setup Geode CLI
      uses: geode-sdk/setup-geode@main

    # Agora sim, roda o build com o ambiente todo preparado!
    - name: Build Mod
      uses: geode-sdk/build-geode-mod@main  
      with:
        platform: ${{ matrix.config.platform }}